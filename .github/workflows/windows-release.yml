name: Windows Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore windows/Snoopy.Windows.sln

      - name: Publish win-x64
        run: >
          dotnet publish windows/Snoopy.Windows/Snoopy.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o windows/release/win-x64

      - name: Package release zip
        shell: pwsh
        run: |
          Compress-Archive -Path windows/release/win-x64/* -DestinationPath windows/release/Snoopy.Windows-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snoopy.Windows-win-x64
          path: windows/release/Snoopy.Windows-win-x64.zip

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/release/Snoopy.Windows-win-x64.zip
